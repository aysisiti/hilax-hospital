<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hilax Dashboard</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="logo">
    <img src="582221153_3245586005590473_148317653042354864_n.jpg" class="logo-img" alt="Logo">
    Hilax Hospital
  </div>
  <nav>
    <a href="#" class="btn-nav" id="logout-btn">Logout</a>
  </nav>
</header>

<main id="dash" class="dash" hidden>
  <section class="dash-card">
    <h2 id="dash-name"></h2>
    <p id="dash-role"></p>
  </section>

  <!-- Staff: patient list and records -->
  <section id="staff-panel" class="panel" hidden>
    <div id="st-list-view">
      <input type="search" id="st-search" class="search-box" placeholder="Search patient name or number" autocomplete="off">
      <p id="st-msg" class="form-msg" role="alert"></p>
      <div id="st-list" class="acc-list"></div>
    </div>

    <div id="st-detail-view" hidden>
      <button type="button" id="st-back" class="btn-small">&larr; Patients</button>
      <div class="dash-card st-patient">
        <h2 id="st-pt-name"></h2>
        <p id="st-pt-sub"></p>
      </div>

      <form id="vitalsForm" class="inline-form" hidden novalidate>
        <h3>Record vitals</h3>
        <div class="form-grid">
          <input type="number" id="vt-hr" placeholder="Heart rate (bpm)" inputmode="numeric" min="20" max="300" step="1" autocomplete="off">
          <input type="number" id="vt-temp" placeholder="Temp (&deg;C)" inputmode="decimal" min="30" max="45" step="0.1" autocomplete="off">
          <input type="number" id="vt-sys" placeholder="Systolic" inputmode="numeric" min="50" max="300" step="1" autocomplete="off">
          <input type="number" id="vt-dia" placeholder="Diastolic" inputmode="numeric" min="30" max="200" step="1" autocomplete="off">
        </div>
        <button type="submit" class="btn-primary">Save</button>
        <p id="vt-msg" class="form-msg" role="alert"></p>
      </form>

      <div id="st-tabs" class="tabs"></div>
      <p id="st-rec-msg" class="form-msg" role="alert"></p>
      <div id="st-records" class="acc-list"></div>
    </div>
  </section>

  <!-- Patient: own records -->
  <section id="patient-panel" class="panel" hidden>
    <div id="pt-tabs" class="tabs">
      <button type="button" data-tab="vitals" class="active">Vitals</button>
      <button type="button" data-tab="prescriptions">Prescriptions</button>
      <button type="button" data-tab="labs">Lab results</button>
      <button type="button" data-tab="imaging">Imaging</button>
      <button type="button" data-tab="bills">Bills</button>
    </div>
    <p id="pt-msg" class="form-msg" role="alert"></p>
    <div id="pt-content" class="acc-list"></div>
  </section>

  <!-- HR / Admin: account management -->
  <section id="admin-panel" class="panel" hidden>
    <div class="panel-bar">
      <input type="search" id="acc-search" placeholder="Search name or number" autocomplete="off">
      <select id="acc-filter" aria-label="Filter by role">
        <option value="">All roles</option>
        <option value="patient">Patient</option>
        <option value="physician">Physician</option>
        <option value="nurse">Nurse</option>
        <option value="pharmacist">Pharmacist</option>
        <option value="medtech">MedTech</option>
        <option value="radtech">RadTech</option>
        <option value="hr_admin">HR / Admin</option>
      </select>
      <button type="button" class="btn-primary" id="new-account-btn">+ New account</button>
    </div>
    <p id="acc-msg" class="form-msg" role="alert"></p>
    <div id="acc-list" class="acc-list"></div>
  </section>
</main>

<!-- Shown to new accounts until they replace the temporary password -->
<section id="pw-overlay" class="form-section">
  <form id="pwForm">
    <h2>New Password</h2>
    <input type="password" id="pw-current" placeholder="Temporary password" autocomplete="current-password" required>
    <input type="password" id="pw-new" placeholder="New password" autocomplete="new-password" minlength="8" maxlength="72" required>
    <input type="password" id="pw-confirm" placeholder="Confirm new password" autocomplete="new-password" minlength="8" maxlength="72" required>
    <button type="submit" class="btn-primary">Save</button>
    <p id="pw-msg" class="form-msg" role="alert"></p>
  </form>
</section>

<!-- HR / Admin: new account -->
<section id="create-overlay" class="form-section">
  <button type="button" class="close-btn" id="create-close">X</button>
  <form id="createForm">
    <h2>New Account</h2>
    <select id="c-role" required>
      <option value="patient">Patient</option>
      <option value="physician">Physician</option>
      <option value="nurse">Nurse</option>
      <option value="pharmacist">Pharmacist</option>
      <option value="medtech">MedTech</option>
      <option value="radtech">RadTech</option>
      <option value="hr_admin">HR / Admin</option>
    </select>
    <input type="text" id="c-name" placeholder="Full name" maxlength="120" autocomplete="off" required>
    <input type="email" id="c-email" placeholder="Email" maxlength="254" autocomplete="off" autocapitalize="none">
    <div id="c-patient-fields">
      <input type="number" id="c-age" placeholder="Age" min="0" max="150" step="1" inputmode="numeric">
      <select id="c-sex">
        <option value="" disabled selected>Sex</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="other">Other</option>
      </select>
      <input type="text" id="c-address" placeholder="Address" maxlength="300" autocomplete="off">
    </div>
    <button type="submit" class="btn-primary">Create</button>
    <p id="create-msg" class="form-msg" role="alert"></p>
  </form>
</section>

<!-- HR / Admin: shown once after creating an account or resetting a password -->
<section id="cred-overlay" class="form-section">
  <div class="cred-box">
    <h2 id="cred-title"></h2>
    <p class="cred-name" id="cred-name"></p>
    <p class="cred-label">Login</p>
    <p class="cred-value" id="cred-login"></p>
    <p class="cred-label">Password</p>
    <p class="cred-value" id="cred-password"></p>
    <button type="button" class="btn-primary" id="cred-copy">Copy</button>
    <button type="button" class="btn-secondary" id="cred-close">Done</button>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="admin.js"></script>
<script src="records.js"></script>
<script src="patient.js"></script>
<script src="staff.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
